<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://document.local data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri https://document.local">
<title>Markdown 文档</title><link rel="stylesheet" href="style.css"></head>
<body data-mode="read">
<header id="titlebar" aria-label="文档工具栏">
<div class="document-group"><button id="outlineToggle" class="icon-button" title="显示或隐藏目录" aria-label="显示或隐藏目录" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m4-11h4m-4 6h4"/></svg></button><button id="searchToggle" class="icon-button" title="查找 Ctrl+F" aria-label="查找"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><div class="file-info drag-area" title="拖动窗口，双击最大化"><b id="filename">未命名.md</b><span id="saveState">本地文档</span></div></div>
<div class="mode-switch" aria-label="显示模式"><button data-mode="read" class="active">阅读</button><button data-mode="split">双栏</button><button data-mode="edit">编辑</button></div>
<div class="toolbar-actions"><label class="font-control" title="阅读字号"><span>Aa</span><select id="fontSize" aria-label="阅读字号"><option value="15">15</option><option value="17" selected>17</option><option value="19">19</option><option value="21">21</option><option value="24">24</option></select></label><button id="theme" class="icon-button" title="切换浅色／深色" aria-label="切换浅色或深色主题"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg></button><span class="divider"></span>
<div class="file-actions"><button data-action="new" title="新建 Ctrl+N" aria-label="新建文档"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="action-label">新建</span></button><button data-action="open" title="打开 Ctrl+O" aria-label="打开文档"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2M3 19l3-8h15l-3 8Z"/></svg><span class="action-label">打开</span></button><button data-action="save" class="primary" title="保存 Ctrl+S">保存</button><button id="more" class="icon-button" title="更多文件操作" aria-label="更多文件操作" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button><div class="menu" id="fileMenu" hidden><button data-action="saveAs">另存为… <kbd>Ctrl+Shift+S</kbd></button><button data-action="pdf">导出 PDF… <kbd>Ctrl+P</kbd></button><button data-action="html">导出阅读版 HTML…</button><button data-action="help">使用说明</button></div></div>
<div class="window-controls"><button data-window="minimize" title="最小化" aria-label="最小化"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button><button data-window="maximize" id="maximizeWindow" title="最大化 / 还原" aria-label="最大化或还原"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button><button data-window="close" class="close-window" title="关闭窗口" aria-label="关闭窗口"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M7 17 17 7"/></svg></button></div></div>
</header>
<div class="searchbar" id="searchbar" hidden><input id="query" placeholder="在当前文档中查找…" aria-label="查找文字"><span id="matchCount"></span><button id="prevMatch" title="上一处" aria-label="上一处">↑</button><button id="nextMatch" title="下一处" aria-label="下一处">↓</button><button id="closeSearch" title="关闭查找" aria-label="关闭查找">×</button></div>
<main><aside id="sidebar"><div class="aside-label">目录 <span id="headingCount">0</span></div><nav id="outline" tabindex="0" aria-label="文档目录"></nav><div class="aside-bottom"><span class="local-dot"></span> 本地文档</div></aside><section id="editorPane"><div class="pane-label">MARKDOWN <span>源文本</span></div><div class="format-bar"><button data-format="heading" title="标题">H</button><button data-format="bold" title="粗体 Ctrl+B"><b>B</b></button><button data-format="italic" title="斜体 Ctrl+I"><i>I</i></button><button data-format="code" title="行内代码">&lt;/&gt;</button><button data-format="link" title="链接">↗</button><button data-format="list" title="列表">≡</button><button data-format="quote" title="引用">❞</button><button data-format="table" title="表格">▦</button></div><textarea id="editor" spellcheck="false" aria-label="Markdown 编辑器"></textarea></section><section id="readerPane" tabindex="0" aria-label="文档阅读区"><div id="paperWrap"><article id="paper" class="markdown-body"></article><div class="paper-end">— 文档结束 —</div></div></section></main>
<footer><span id="position">Markdown</span><span id="stats"></span><span id="encoding">UTF-8 · 本地文件</span></footer><div id="toast" role="status" hidden></div>
<script src="markdown-it.min.js"></script><script src="purify.min.js"></script><script src="app.js"></script></body></html>
